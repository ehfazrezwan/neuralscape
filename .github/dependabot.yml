version: 2

# Scope Dependabot to Neuralscape's own manifests only. The `mem0/` and
# `graphiti/` directories are vendored as git subtrees from upstream and
# include example apps / demos that are not built or deployed by us —
# scanning them produces noise (alerts on Next.js demos, embedchain
# example frontends, etc.) that has no bearing on the Neuralscape
# service or plugin. Track those via upstream's own Dependabot.

updates:
  # Neuralscape service (Python + uv)
  - package-ecosystem: "pip"
    directory: "/neuralscape-service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "service"

  # Neuralscape plugin (TypeScript + npm)
  - package-ecosystem: "npm"
    directory: "/neuralscape-plugin"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "plugin"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"
