name: service-ci

# Enforces the CLAUDE.md Container Build Gate (HARD RULE): no merge into dev
# or main without a Docker build AND an in-container test run of the exact
# tree. Host pytest alone cannot catch missing Dockerfile COPY paths — the
# 2026-07-05 memory/ package incident (PR #136 → #138) is the origin story.
#
# Trigger shape: runs on EVERY PR so the jobs can be marked as required
# checks; the `changes` job path-filters internally and non-service PRs get
# "skipped" jobs, which GitHub treats as passing for required checks.

on:
  pull_request:
  push:
    branches: [dev, main]
    paths:
      - "neuralscape-service/**"
      - "mem0/**"
      - "graphiti/**"
      - "docker-compose*.yml"
      - ".github/workflows/service-ci.yml"

concurrency:
  group: service-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      service: ${{ steps.filter.outputs.service }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            service:
              - "neuralscape-service/**"
              - "mem0/**"
              - "graphiti/**"
              - "docker-compose*.yml"
              - ".github/workflows/service-ci.yml"

  # The graphiti/ and mem0/ subtrees are pruned to library core (see
  # scripts/sync-upstream.sh keep-lists). When upstream app/example manifests
  # slip in (e.g. a pull from the unfiltered remote), dependabot floods the
  # security tab with alerts for code we never install — one past sync left
  # 31 stale alerts to triage away. Fail fast at PR time instead.
  subtree-prune-guard:
    needs: changes
    if: needs.changes.outputs.service == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fail if non-core files are tracked under the subtrees
        run: |
          bad=$(git ls-files mem0/ graphiti/ \
            | grep -vE '^mem0/(mem0|pyproject\.toml|poetry\.lock|README\.md|LICENSE|\.agents|\.claude-plugin|\.cursor-plugin|\.gitignore|\.pre-commit-config\.yaml)(/|$)' \
            | grep -vE '^graphiti/(graphiti_core|pyproject\.toml|uv\.lock|README\.md|LICENSE|py\.typed|\.env\.example|\.gitignore)(/|$)' \
            || true)
          if [ -n "$bad" ]; then
            echo "::error::Non-core files tracked under the pruned subtrees (policy: library core only — they rot into dependabot noise):"
            echo "$bad"
            exit 1
          fi
          echo "subtrees clean"

  host-tests:
    needs: changes
    if: needs.changes.outputs.service == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neuralscape-service
    env:
      # Unit tests mock all external services; these only satisfy Settings.
      GOOGLE_API_KEY: ci-dummy
      NEO4J_PASSWORD: ci-dummy
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "neuralscape-service/uv.lock"
      - name: Install dependencies
        # --extra code-graph: the suite includes code-graph adapter tests
        # (test_cbm_import, test_code_resolve*) that import zstandard/jedi.
        # Without the extra they fail on import here while passing in-container
        # (the image installs it) — a phantom FAILURE on every service PR.
        run: uv sync --frozen --extra code-graph
      - name: Run fast suite
        run: uv run pytest tests/ --ignore=tests/test_async_pipeline.py -q

  python310-contracts:
    needs: changes
    if: needs.changes.outputs.service == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run contract floor suite on Python 3.10
        shell: bash
        run: |
          set -euo pipefail

          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::checkout does not match the candidate SHA"
            exit 1
          fi

          required_contract_files=(
            neuralscape-service/contracts_common.py
            neuralscape-service/contracts_errors.py
            neuralscape-service/contracts_references.py
            neuralscape-service/contracts_engines.py
            neuralscape-service/contracts_inference.py
            neuralscape-service/tests/test_contracts_common.py
            neuralscape-service/tests/test_contracts_engines.py
            neuralscape-service/tests/test_contracts_inference.py
          )
          missing=0
          for path in "${required_contract_files[@]}"; do
            if [ ! -f "$path" ]; then
              echo "::error file=$path::required Python 3.10 contract file is missing"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          docker run --rm \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --workdir /workspace/neuralscape-service \
            --env PYTHONDONTWRITEBYTECODE=1 \
            python:3.10-slim \
            sh -euxc '
              python -c "import sys; assert sys.version_info[:2] == (3, 10), sys.version"
              python -m pip install --disable-pip-version-check --no-cache-dir \
                "pydantic-settings>=2.0.0" \
                "jsonschema>=4.26.0,<5" \
                "pytest>=8.0.0"
              python -c "import contracts_common, contracts_references, contracts_engines, contracts_inference"
              # These pure contract tests do not use the service suite
              # auth/config fixtures. The full host and container jobs still
              # load conftest.py and exercise the complete service environment.
              python -m pytest --noconftest -p no:cacheprovider \
                tests/test_contracts_common.py \
                tests/test_contracts_engines.py \
                tests/test_contracts_inference.py \
                -q
            '

  container-gate:
    needs: changes
    if: needs.changes.outputs.service == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build test-stage image (suite runs in-container)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: neuralscape-service/Dockerfile
          target: test
          load: true
          tags: ns-gate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run suite inside the packaged image
        run: docker run --rm ns-gate:ci
      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: neuralscape-service/Dockerfile
          target: runtime
          load: true
          tags: ns-gate-rt:ci
          cache-from: type=gha

  service-gate:
    if: ${{ always() }}
    needs: [changes, subtree-prune-guard, host-tests, python310-contracts, container-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Require service checks or an intentional non-service skip
        env:
          EVENT_NAME: ${{ github.event_name }}
          SERVICE_CHANGED: ${{ needs.changes.outputs.service }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          SUBTREE_RESULT: ${{ needs.subtree-prune-guard.result }}
          HOST_RESULT: ${{ needs.host-tests.result }}
          PYTHON310_RESULT: ${{ needs.python310-contracts.result }}
          CONTAINER_RESULT: ${{ needs.container-gate.result }}
        run: |
          set -eu

          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::changes job did not succeed: $CHANGES_RESULT"
            exit 1
          fi

          case "$SERVICE_CHANGED" in
            true|false) ;;
            *)
              echo "::error::service filter returned an unknown value: $SERVICE_CHANGED"
              exit 1
              ;;
          esac

          if [ "$EVENT_NAME" = "push" ] || [ "$SERVICE_CHANGED" = "true" ]; then
            expected="success"
          elif [ "$EVENT_NAME" = "pull_request" ] && [ "$SERVICE_CHANGED" = "false" ]; then
            expected="skipped"
          else
            echo "::error::unsupported event/filter combination: $EVENT_NAME/$SERVICE_CHANGED"
            exit 1
          fi

          for result in "$SUBTREE_RESULT" "$HOST_RESULT" "$PYTHON310_RESULT" "$CONTAINER_RESULT"; do
            if [ "$result" != "$expected" ]; then
              echo "::error::service check result '$result'; expected '$expected'"
              exit 1
            fi
          done
