# Restricted HAProxy config for tecnativa/docker-socket-proxy v0.5.0, mounted over
# the image's haproxy.cfg.template (the image seds ${BIND_CONFIG} into it).
#
# Why a custom file: the stock config gates by API section, and the `containers`
# section covers create/start/exec-create as well as list and restart, so the
# stock env switches (CONTAINERS=1 + POST=1) cannot express "list + restart only".
# This one allows exactly what autoheal calls and denies everything else:
#   GET  /containers/json                  (list unhealthy containers)
#   POST /containers/<id>/restart          (restart one)
# Everything else (create, start, exec, images, volumes, networks, events, ping,
# version, ...) falls through to the final deny. The global/defaults sections and the
# docker backend are the upstream file's; the events backend and every other allow
# rule are removed.
#
# Not exercised without a Docker daemon: validated by the VPS gate. If the proxy
# fails to start, autoheal does nothing (the stack still runs, nothing self-heals).
global
    log stdout format raw daemon "${LOG_LEVEL}"

    pidfile /run/haproxy.pid
    maxconn 4000

    # Turn on stats unix socket
    server-state-file /var/lib/haproxy/server-state

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    option redispatch
    retries 3
    timeout http-request 10s
    timeout queue 1m
    timeout connect 10s
    timeout client 10m
    timeout server 10m
    timeout http-keep-alive 10s
    timeout check 10s
    maxconn 3000

    # Allow seamless reloads
    load-server-state-from-file global

    # Use provided example error pages
    errorfile 400 /usr/local/etc/haproxy/errors/400.http
    errorfile 403 /usr/local/etc/haproxy/errors/403.http
    errorfile 408 /usr/local/etc/haproxy/errors/408.http
    errorfile 500 /usr/local/etc/haproxy/errors/500.http
    errorfile 502 /usr/local/etc/haproxy/errors/502.http
    errorfile 503 /usr/local/etc/haproxy/errors/503.http
backend dockerbackend
    server dockersocket $SOCKET_PATH

frontend dockerfrontend
    bind ${BIND_CONFIG}
    http-request allow if METH_GET { path,url_dec -m reg -i ^(/v[\d\.]+)?/containers/json$ }
    http-request allow if METH_POST { path,url_dec -m reg -i ^(/v[\d\.]+)?/containers/[a-zA-Z0-9_.-]+/restart$ }
    http-request deny
    default_backend dockerbackend
