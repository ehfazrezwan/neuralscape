services:
  neo4j:
    image: neo4j:5-community
    ports:
      - target: 7474
        published: ${NEO4J_HTTP_PORT:-7481}
        protocol: tcp
      - target: 7687
        published: ${NEO4J_BOLT_PORT:-7694}
        protocol: tcp
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neuralscape}
      NEO4J_initial_dbms_default__database: ${NEO4J_DATABASE:-memory}
    volumes:
      - type: volume
        source: neo4j_data
        target: /data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-neuralscape}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - target: 6379
        published: ${REDIS_PORT:-6386}
        protocol: tcp
    volumes:
      - type: volume
        source: redis_data
        target: /data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.15.0
    ports:
      - target: 6333
        published: ${QDRANT_HTTP_PORT:-6340}
        protocol: tcp
      - target: 6334
        published: ${QDRANT_GRPC_PORT:-6341}
        protocol: tcp
    volumes:
      - type: volume
        source: qdrant_data
        target: /qdrant/storage
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 3s
      retries: 5

  neuralscape:
    build:
      context: .
      dockerfile: neuralscape-service/Dockerfile
    ports:
      - target: 8199
        published: ${NEURALSCAPE_PORT:-8199}
        protocol: tcp
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    env_file: .env
    environment:
      NEO4J_URI: neo4j://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neuralscape}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-memory}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379
      GEMINI_LLM_MODEL: ${SMALL_MODEL_NAME:-gemini-3-flash-preview}
      GEMINI_EMBEDDER_MODEL: ${EMBEDDING_MODEL_NAME:-gemini-embedding-001}
      MCP_TRANSPORT: http
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8199/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3

  neuralscape-worker:
    build:
      context: .
      dockerfile: neuralscape-service/Dockerfile
    command: ["arq", "worker.WorkerSettings"]
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    env_file: .env
    environment:
      NEO4J_URI: neo4j://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neuralscape}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-memory}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379
      GEMINI_LLM_MODEL: ${SMALL_MODEL_NAME:-gemini-3-flash-preview}
      GEMINI_EMBEDDER_MODEL: ${EMBEDDING_MODEL_NAME:-gemini-embedding-001}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys; sys.exit(0)\""]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  neo4j_data:
  qdrant_data:
  redis_data:
