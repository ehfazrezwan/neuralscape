services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/neuralscape
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "neuralscape", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  neuralscape:
    build:
      context: .
      dockerfile: neuralscape-service/Dockerfile
    ports:
      - "8199:8199"
    depends_on:
      neo4j:
        condition: service_healthy
    env_file: .env
    environment:
      NEO4J_URI: neo4j://neo4j:7687
      NEO4J_PASSWORD: neuralscape
      NEO4J_DATABASE: memory
      QDRANT_PATH: /data/qdrant
      GEMINI_LLM_MODEL: ${SMALL_MODEL_NAME:-gemini-3-flash-preview}
      GEMINI_EMBEDDER_MODEL: ${EMBEDDING_MODEL_NAME:-gemini-embedding-001}
    volumes:
      - qdrant_data:/data/qdrant

volumes:
  neo4j_data:
  qdrant_data:
