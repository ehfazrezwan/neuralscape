services:
  # Neo4j — uncomment if not using Neo4j Desktop locally
  # neo4j:
  #   image: neo4j:5-community
  #   ports:
  #     - "7474:7474"
  #     - "7687:7687"
  #   environment:
  #     NEO4J_AUTH: neo4j/neuralscape
  #   volumes:
  #     - neo4j_data:/data
  #   healthcheck:
  #     test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "neuralscape", "RETURN 1"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  neuralscape:
    build:
      context: .
      dockerfile: neuralscape-service/Dockerfile
    ports:
      - "8199:8199"
    depends_on:
      # neo4j:
      #   condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    env_file: .env
    environment:
      NEO4J_URI: ${NEO4J_URI:-neo4j://host.docker.internal:7687}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neuralscape}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-memory}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379
      GEMINI_LLM_MODEL: ${SMALL_MODEL_NAME:-gemini-3-flash-preview}
      GEMINI_EMBEDDER_MODEL: ${EMBEDDING_MODEL_NAME:-gemini-embedding-001}

  neuralscape-worker:
    build:
      context: .
      dockerfile: neuralscape-service/Dockerfile
    command: ["arq", "worker.WorkerSettings"]
    depends_on:
      # neo4j:
      #   condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    env_file: .env
    environment:
      NEO4J_URI: ${NEO4J_URI:-neo4j://host.docker.internal:7687}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neuralscape}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-memory}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379
      GEMINI_LLM_MODEL: ${SMALL_MODEL_NAME:-gemini-3-flash-preview}
      GEMINI_EMBEDDER_MODEL: ${EMBEDDING_MODEL_NAME:-gemini-embedding-001}

volumes:
  neo4j_data:
  qdrant_data:
  redis_data:
