apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuralscape-graph-worker
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: neuralscape-graph-worker
    app.kubernetes.io/component: graph-worker
    {{- include "neuralscape.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.graphWorker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: neuralscape-graph-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neuralscape-graph-worker
        app.kubernetes.io/component: graph-worker
        {{- include "neuralscape.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: graph-worker
          image: {{ include "neuralscape.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Slow graph queue (GRAPH_QUEUE_NAME): Graphiti enrichment, dedup +
          # dreaming-sweep + strategy-playbook crons. Isolated so heavy graph work
          # can't starve the fast worker/reads.
          command: ["arq", "worker.GraphWorkerSettings"]
          {{- include "neuralscape.env" . | nindent 10 }}
          volumeMounts:
            - name: vault
              mountPath: /data/vault
          resources:
            {{- toYaml .Values.graphWorker.resources | nindent 12 }}
          {{- if .Values.workerLiveness.enabled }}
          # Liveness only: the worker event loop touches the heartbeat file
          # (worker_liveness.py); fail when it is missing or >240s old (4 min; 5 min before unhealthy).
          # startupProbe gates the liveness probe: a slow cold start (model load,
          # backend connect) gets up to 60 x 10s = 600s before liveness applies.
          startupProbe:
            exec:
              command: ["python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.stat(os.environ.get('NS_WORKER_HEARTBEAT_FILE','/tmp/ns-worker.heartbeat')).st_mtime<240 else 1)"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.stat(os.environ.get('NS_WORKER_HEARTBEAT_FILE','/tmp/ns-worker.heartbeat')).st_mtime<240 else 1)"]
            initialDelaySeconds: 0
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          {{- end }}
      volumes:
        - name: vault
          emptyDir: {}
