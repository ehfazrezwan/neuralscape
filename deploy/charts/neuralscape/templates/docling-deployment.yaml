{{- if .Values.docling.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docling
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: docling
    app.kubernetes.io/component: docling
    {{- include "neuralscape.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.docling.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: docling
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docling
        app.kubernetes.io/component: docling
        {{- include "neuralscape.labels" . | nindent 8 }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: docling
          image: "{{ .Values.docling.image.repository }}:{{ .Values.docling.image.tag }}"
          imagePullPolicy: {{ .Values.docling.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.docling.port }}
          resources:
            {{- toYaml .Values.docling.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: docling
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: docling
    {{- include "neuralscape.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: docling
  ports:
    - name: http
      port: {{ .Values.docling.port }}
      targetPort: http
{{- end }}
