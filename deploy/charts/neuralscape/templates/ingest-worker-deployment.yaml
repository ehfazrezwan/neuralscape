apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuralscape-ingest-worker
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: neuralscape-ingest-worker
    app.kubernetes.io/component: ingest-worker
    {{- include "neuralscape.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ingestWorker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: neuralscape-ingest-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neuralscape-ingest-worker
        app.kubernetes.io/component: ingest-worker
        {{- include "neuralscape.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ingest-worker
          image: {{ include "neuralscape.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Ingest queue (INGEST_QUEUE_NAME): bulk document/file ingest (chunk +
          # Docling parse + LLM fact extraction) + connector sync. Isolated so a
          # folder/zip upload can't starve the fast worker/reads.
          command: ["arq", "worker.IngestWorkerSettings"]
          {{- include "neuralscape.env" . | nindent 10 }}
          volumeMounts:
            - name: vault
              mountPath: /data/vault
            {{- include "neuralscape.ingestVolumeMount" . | nindent 12 }}
          resources:
            {{- toYaml .Values.ingestWorker.resources | nindent 12 }}
          livenessProbe:
            exec:
              command: ["python", "-c", "import sys; sys.exit(0)"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: vault
          emptyDir: {}
        {{- include "neuralscape.ingestVolume" . | nindent 8 }}
