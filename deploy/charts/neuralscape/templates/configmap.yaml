apiVersion: v1
kind: ConfigMap
metadata:
  name: neuralscape-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "neuralscape.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  # Tie the app's artifact-storage mode to whether a shared RWX volume exists.
  # Without one (ingestStorage.enabled=false) the API must NOT write artifacts to
  # an unshared emptyDir the worker can't read — it ships bytes through Redis instead.
  INGEST_STORAGE_ENABLED: {{ .Values.ingestStorage.enabled | quote }}
