apiVersion: v1
kind: ConfigMap
metadata:
  name: neuralscape-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "neuralscape.labels" . | nindent 4 }}
{{- /* Docling wiring follows docling.* so the app never points at a Deployment this
       release did not create; a key in .Values.config wins. The ingest-storage
       switch is NOT overridable: without a shared RWX volume (ingestStorage.enabled
       =false) the API must not write artifacts to an unshared emptyDir the worker
       can't read, so bytes ship through Redis instead. */}}
{{- $cfg := mergeOverwrite (dict "DOCLING_ENABLED" (.Values.docling.enabled | toString) "DOCLING_URL" (printf "http://docling:%v" .Values.docling.port)) .Values.config }}
{{- $_ := set $cfg "INGEST_STORAGE_ENABLED" (.Values.ingestStorage.enabled | toString) }}
data:
  {{- range $k, $v := $cfg }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
