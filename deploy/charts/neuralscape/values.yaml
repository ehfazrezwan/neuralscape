# Neuralscape app-tier values. The stateful backends (Neo4j/Qdrant/Redis), the
# namespace, and the `neuralscape-secrets` Secret are managed OUTSIDE this chart
# (deploy/k8s/) — this chart deploys the API + workers + their ServiceAccount.
#
# Defaults here are GENERIC. Environment-specific values (image repo, public URL,
# node pool, GCP service account, auth domains) are supplied at deploy time from
# a private overlay / terraform.tfvars — never committed to this public repo.

image:
  repository: neuralscape/neuralscape
  # Pinned image tag. Empty = use the chart's appVersion (Chart.yaml). A floating
  # "latest" is rejected at render time (see _helpers.tpl). Deployments set an
  # explicit immutable tag (deploy/terraform passes image_tag; the CI image is
  # published as sha-<12>).
  tag: ""
  pullPolicy: IfNotPresent

serviceAccount:
  name: neuralscape-sa
  # Set to a GCP service account email to enable Workload Identity (wired
  # automatically by deploy/terraform). Empty = a plain ServiceAccount.
  gcpServiceAccountEmail: ""

# Optional nodeSelector for all pods (node-pool labels are cluster-specific).
# Empty = schedule anywhere. Set via a private overlay to pin to a pool.
nodeSelector: {}

# App configuration (rendered into the `neuralscape-config` ConfigMap).
#
# Deliberately SPARSE: every key here must be a real Settings field of
# neuralscape-service/config.py (or a documented extension key), and this chart
# carries NO second copy of config.py's defaults. Anything not set here falls
# through to config.py (model names, log level/format, auth provider, Neo4j user
# and database, ...). Set a key here only to override config.py for a cluster.
# A test (tests/test_deploy_chart_parity.py) enforces this.
config:
  # In-cluster backend addresses (match the Services in deploy/k8s/).
  NEO4J_URI: "neo4j://neo4j:7687"
  QDRANT_URL: "http://qdrant:6333"
  REDIS_URL: "redis://redis:6379"
  # The container serves MCP over HTTP (config.py defaults to stdio for the CLI).
  MCP_TRANSPORT: "http"
  # Mount path of the shared artifact volume (INGEST_STORAGE_ENABLED, DOCLING_ENABLED
  # and DOCLING_URL are derived in templates/configmap.yaml from ingestStorage.* and
  # docling.*; a key set here wins for the Docling pair).
  INGEST_STORAGE_DIR: "/data/ingest"
  # Vault scratch mount (conversation-compiler extension setting).
  OBSIDIAN_VAULT_PATH: "/data/vault"
  # Vendored mem0/Graphiti send anonymous usage telemetry to an external host
  # unless disabled. Off by default (config.py leaves it unset); set "true" to opt in.
  MEM0_TELEMETRY: "false"
  GRAPHITI_TELEMETRY_ENABLED: "false"
  # Public HTTPS URL (must match the ingress host). Enables the OAuth AS when set
  # together with the user-token secret. Unset here on purpose; deploy/terraform
  # sets it from `neuralscape_domain`, a bare chart install leaves OAuth off.
  # NEURALSCAPE_PUBLIC_URL: "https://neuralscape.example.com"
  # Auth defaults to config.py's AUTH_PROVIDER (token-paste). Set AUTH_PROVIDER=google
  # and AUTH_ALLOWED_DOMAINS in a private overlay for consent-screen login.

# Keys read from the ESO-synced `neuralscape-secrets` Secret (deploy/k8s/).
secretName: neuralscape-secrets

# Generic passthroughs for a private overlay to inject extra config/secrets into
# every workload without this public chart naming them.
#   extraEnv:        list of { name, value } → literal env vars
#   extraEnvSecrets: list of { name, secretKey } → env from a key in secretName
# Example (set in a private values overlay, not here):
#   extraEnv:
#     - { name: SOME_FEATURE_ENABLED, value: "true" }
#   extraEnvSecrets:
#     - { name: SOME_UPSTREAM_URL, secretKey: some-upstream-url }
#     - { name: SOME_UPSTREAM_TOKEN, secretKey: some-upstream-token }
extraEnv: []
extraEnvSecrets: []

api:
  replicaCount: 1
  containerPort: 8199
  service:
    type: ClusterIP
    port: 80
  resources:
    requests: { cpu: "250m", memory: "1Gi" }
    limits: { cpu: "1000m", memory: "2Gi" }
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80

worker:
  replicaCount: 1
  resources:
    requests: { cpu: "250m", memory: "1Gi" }
    limits: { cpu: "1000m", memory: "2Gi" }

graphWorker:
  replicaCount: 1
  resources:
    requests: { cpu: "250m", memory: "1Gi" }
    limits: { cpu: "1000m", memory: "2Gi" }

# Dedicated ingest worker: bulk document/file ingest + connector sync, isolated
# from the fast worker so a folder/zip upload can't starve vector writes/reads.
ingestWorker:
  replicaCount: 1
  resources:
    requests: { cpu: "250m", memory: "1Gi" }
    limits: { cpu: "1000m", memory: "2Gi" }

# Docling document converter (rich formats → Markdown). The preferred extractor;
# the ingest worker falls back to in-process MarkItDown when it's disabled/down.
# CPU/RAM-heavy (ML models) — size for the workload in a private overlay.
docling:
  enabled: true
  image:
    repository: ghcr.io/docling-project/docling-serve
    # Same pinned release the compose stack runs; never a floating tag.
    tag: v1.38.2
    pullPolicy: IfNotPresent
  replicaCount: 1
  port: 5001
  resources:
    requests: { cpu: "500m", memory: "2Gi" }
    limits: { cpu: "2000m", memory: "4Gi" }

# Shared artifact storage for uploaded files (the API writes them, the ingest
# worker reads them back to parse). It needs ReadWriteMany so BOTH pods can mount
# it (e.g. Filestore on GKE) — a plain default (RWO) StorageClass would leave the
# PVC Pending. So this is OFF by default: a bare `helm install` runs fine and the
# app falls back to shipping file bytes through Redis (INGEST_STORAGE_ENABLED is
# tied to this flag in the ConfigMap — see configmap.yaml). For production file
# ingest, provide an RWX `storageClass` (or `existingClaim`) and set enabled=true.
ingestStorage:
  enabled: false
  create: true
  existingClaim: ""
  accessMode: ReadWriteMany
  storageClass: ""
  size: 10Gi
