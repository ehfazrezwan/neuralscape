# Neuralscape app-tier values. The stateful backends (Neo4j/Qdrant/Redis), the
# namespace, and the `neuralscape-secrets` Secret are managed OUTSIDE this chart
# (deploy/k8s/) — this chart deploys the API + workers + their ServiceAccount.
#
# Defaults here are GENERIC. Environment-specific values (image repo, public URL,
# node pool, GCP service account, auth domains) are supplied at deploy time from
# a private overlay / terraform.tfvars — never committed to this public repo.

image:
  repository: neuralscape/neuralscape
  tag: latest
  pullPolicy: IfNotPresent

serviceAccount:
  name: neuralscape-sa
  # Set to a GCP service account email to enable Workload Identity (wired
  # automatically by deploy/terraform). Empty = a plain ServiceAccount.
  gcpServiceAccountEmail: ""

# Optional nodeSelector for all pods (node-pool labels are cluster-specific).
# Empty = schedule anywhere. Set via a private overlay to pin to a pool.
nodeSelector: {}

# In-cluster backend addresses (match the Services in deploy/k8s/).
config:
  NEO4J_URI: "neo4j://neo4j:7687"
  NEO4J_USER: "neo4j"
  NEO4J_DATABASE: "memory"
  QDRANT_URL: "http://qdrant:6333"
  REDIS_URL: "redis://redis:6379"
  MCP_TRANSPORT: "http"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  GEMINI_LLM_MODEL: "gemini-3-flash-preview"
  GEMINI_LLM_FALLBACK_MODEL: "gemini-2.5-flash"
  GEMINI_EMBEDDER_MODEL: "gemini-embedding-001"
  # Document/file ingestion: artifact storage volume + Docling converter.
  INGEST_STORAGE_DIR: "/data/ingest"
  DOCLING_ENABLED: "true"
  DOCLING_URL: "http://docling:5001"
  # Auth. Default is token-paste (no external IdP). Set AUTH_PROVIDER=google and
  # AUTH_ALLOWED_DOMAINS in a private overlay for consent-screen login.
  AUTH_PROVIDER: "token"
  # Public HTTPS URL (must match the ingress host). Enables the OAuth AS when set
  # together with the user-token secret.
  NEURALSCAPE_PUBLIC_URL: "https://neuralscape.example.com"
  OBSIDIAN_VAULT_PATH: "/data/vault"

# Keys read from the ESO-synced `neuralscape-secrets` Secret (deploy/k8s/).
secretName: neuralscape-secrets

# Generic passthroughs for a private overlay to inject extra config/secrets into
# every workload without this public chart naming them.
#   extraEnv:        list of { name, value } → literal env vars
#   extraEnvSecrets: list of { name, secretKey } → env from a key in secretName
# Example (set in a private values overlay, not here):
#   extraEnv:
#     - { name: SOME_FEATURE_ENABLED, value: "true" }
#   extraEnvSecrets:
#     - { name: SOME_UPSTREAM_URL, secretKey: some-upstream-url }
#     - { name: SOME_UPSTREAM_TOKEN, secretKey: some-upstream-token }
extraEnv: []
extraEnvSecrets: []

api:
  replicaCount: 1
  containerPort: 8199
  service:
    type: ClusterIP
    port: 80
  resources:
    requests: { cpu: "250m", memory: "1Gi" }
    limits: { cpu: "1000m", memory: "2Gi" }
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80

worker:
  replicaCount: 1
  resources:
    requests: { cpu: "250m", memory: "1Gi" }
    limits: { cpu: "1000m", memory: "2Gi" }

graphWorker:
  replicaCount: 1
  resources:
    requests: { cpu: "250m", memory: "1Gi" }
    limits: { cpu: "1000m", memory: "2Gi" }

# Dedicated ingest worker: bulk document/file ingest + connector sync, isolated
# from the fast worker so a folder/zip upload can't starve vector writes/reads.
ingestWorker:
  replicaCount: 1
  resources:
    requests: { cpu: "250m", memory: "1Gi" }
    limits: { cpu: "1000m", memory: "2Gi" }

# Docling document converter (rich formats → Markdown). The preferred extractor;
# the ingest worker falls back to in-process MarkItDown when it's disabled/down.
# CPU/RAM-heavy (ML models) — size for the workload in a private overlay.
docling:
  enabled: true
  image:
    repository: ghcr.io/docling-project/docling-serve
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  port: 5001
  resources:
    requests: { cpu: "500m", memory: "2Gi" }
    limits: { cpu: "2000m", memory: "4Gi" }

# Shared artifact storage for uploaded files (the API writes them, the ingest
# worker reads them back to parse). Needs ReadWriteMany so both pods mount it
# (e.g. Filestore on GKE). Give an existingClaim, or let the chart create a PVC.
# enabled=false → an emptyDir per pod (single-pod dev only; NOT shared).
ingestStorage:
  enabled: true
  create: true
  existingClaim: ""
  accessMode: ReadWriteMany
  storageClass: ""
  size: 10Gi
