# Syncs Neuralscape's secrets out of GCP Secret Manager into a single in-cluster
# Secret named `neuralscape-secrets`, consumed by the API/workers (Helm chart)
# and by Neo4j (neo4j.yaml). Requires the External Secrets Operator + a
# cluster-wide ClusterSecretStore (default name `gcp-secret-manager`) to already
# exist on the cluster.
#
# Each remoteRef.key is a GCP Secret Manager secret_id created in
# ../terraform/secrets.tf. Populate their VALUES out-of-band before applying:
#   echo -n "<value>" | gcloud secrets versions add <secret_id> --data-file=-
#
# secretKey = the key inside the resulting k8s Secret (what pods reference).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: neuralscape-secrets-sync
  namespace: neuralscape
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: neuralscape-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Neo4j password — used by API/workers (NEO4J_PASSWORD) and Neo4j (NEO4J_AUTH).
    - secretKey: neo4j-password
      remoteRef:
        key: neuralscape-neo4j-password
    # HMAC signing secret for per-user Bearer tokens (multi-user auth).
    - secretKey: neuralscape-user-token-secret
      remoteRef:
        key: neuralscape-user-token-secret
    # Gemini API key.
    - secretKey: google-api-key
      remoteRef:
        key: neuralscape-google-api-key
    # Google OAuth client (consent-screen login; AUTH_PROVIDER=google).
    - secretKey: google-oauth-client-id
      remoteRef:
        key: neuralscape-google-oauth-client-id
    - secretKey: google-oauth-client-secret
      remoteRef:
        key: neuralscape-google-oauth-client-secret
