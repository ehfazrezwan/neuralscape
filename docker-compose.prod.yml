# Production overlay: Caddy (automatic TLS) in front of the API, Redis behind a
# password, and NO published database or app ports. It is a THIN overlay: every
# app service (API, fast worker, graph worker, ingest worker, autoheal, ...) comes
# from docker-compose.yml, so this file cannot drift from them. It used to be a
# full copy that lagged (one worker, no graph/ingest worker, floating tags).
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Add `-f docker-compose.deploy.yml` (and NS_IMAGE=...) to run a prebuilt image.
# Copy .env.production to .env first; DOMAIN, NEO4J_PASSWORD and REDIS_PASSWORD
# are required and compose refuses to start without them.
services:
  neo4j:
    ports: !override []
  qdrant:
    ports: !override []
  docling:
    ports: !override []
  cbm-bridge:
    ports: !override []
  resolver-svc:
    ports: !override []

  redis:
    ports: !override []
    # Password via env, not argv: it stays out of `ps` and `docker inspect` Cmd.
    # REDISCLI_AUTH makes redis-cli (the healthcheck and backup script) authenticate.
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?required}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDISCLI_AUTH\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  # The API is reached only through Caddy on the compose network.
  neuralscape:
    ports: !override []
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?required}@redis:6379
  neuralscape-worker:
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?required}@redis:6379
  neuralscape-graph-worker:
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?required}@redis:6379
  neuralscape-ingest-worker:
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?required}@redis:6379
  neuralscape-test:
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?required}@redis:6379

  caddy:
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?required}
    depends_on:
      neuralscape:
        condition: service_healthy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
