[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuralscape-service"
version = "0.1.0"
description = "Lightweight mem0 + Graphiti memory service with REST and MCP interfaces"
requires-python = ">=3.10"
dependencies = [
    "mem0ai[graphiti]",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "mcp>=1.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv.sources]
graphiti-core = { path = "../graphiti", editable = true }
mem0ai = { path = "../mem0", editable = true }
