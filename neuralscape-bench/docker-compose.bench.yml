# Benchmark override: lets a second (or third) Neuralscape stack run alongside
# the existing one without host-port collisions. Apply ON TOP of a branch's
# docker-compose.yml:
#
#   BENCH_API_PORT=8299 docker compose -p nsbench-<slug> \
#     -f <worktree>/docker-compose.yml -f docker-compose.bench.yml up -d --build
#
# `docker compose -p` already isolates the network + named volumes per project.
# This file additionally removes the backing-store host-port publishes (they're
# only reached in-cluster via service DNS) and maps ONLY the API to an offset
# host port — so any number of stacks coexist, each reachable at its own
# BENCH_API_PORT. The orchestrator sets BENCH_API_PORT per stack.
services:
  # `!reset []` truly clears the base port list — plain `ports: []` MERGES in
  # Compose and leaves the host publishes in place, colliding with an already-
  # running stack (e.g. the live stack on 6379/6333/7687).
  neo4j:
    ports: !reset []
  redis:
    ports: !reset []
  qdrant:
    ports: !reset []
    # The restored full-500 DMR store has enough segments to blow through the
    # docker daemon's default nofile=1024 (qdrant panics at startup: os error 24).
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
  # `!override` REPLACES the base port list (plain merge would keep 8199:8199
  # too and collide with the live stack); `!reset` would wrongly clear it.
  neuralscape:
    ports: !override
      - "${BENCH_API_PORT:-8299}:8199"
    environment:
      # Benchmark-only: opt into multi-party speaker attribution. Production defaults False.
      - EXTRACTION_REQUIRE_SPEAKER=true
