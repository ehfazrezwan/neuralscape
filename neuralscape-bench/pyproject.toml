[project]
name = "neuralscape-bench"
version = "0.1.0"
description = "End-to-end performance benchmark + dashboard for the Neuralscape memory service"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "pydantic>=2.0.0,<3.0.0",
    "uvicorn>=0.32.0",
    "psutil>=5.9.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
# The token-savings navigation benchmark drives a Gemini agent via google-genai.
# Optional so the core bench stays light; install with `uv sync --extra tokensave`.
tokensave = [
    "google-genai>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neuralscape_bench", "icebench", "trackb"]

[tool.hatch.build.targets.wheel.force-include]
"static" = "neuralscape_bench/static"
# The service baseline stack (compose files and in-container scripts) ships with the wheel so the installed
# tests can read the exact files the harness runs.
"scripts/service_baseline" = "neuralscape_bench/service_baseline/stack"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "tests",
    "icebench/tests",
    "icebench/trackq/tests",
    "icebench/tokensave/tests",
    "icebench/report/test_generator.py",
    "icebench/systems/cbm_standalone/test_adapter.py",
    "icebench/systems/graphify_standalone/test_adapter.py",
    "trackb/longmemeval_ref/tests/test_answer.py",
    "trackb/longmemeval_ref/tests/test_grade.py",
    "trackb/longmemeval_ref/tests/test_ingest.py",
    "trackb/longmemeval_ref/tests/test_report.py",
    "trackb/mem0_locomo/tests",
    "trackb/mem0_tracka/tests",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23.0",
]
