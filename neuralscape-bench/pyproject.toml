[project]
name = "neuralscape-bench"
version = "0.1.0"
description = "End-to-end performance benchmark + dashboard for the Neuralscape memory service"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "psutil>=5.9.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neuralscape_bench", "icebench"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "icebench/tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
