version: '3.8'

# ICEBench compose override (project: -p ice)
# Shifts all ports to avoid conflict with nsbench-accuracy stack.
# Uses BIND MOUNTS to /data/ice/stack/* instead of named volumes.

services:
  neo4j:
    image: neo4j:5-community
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-password}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    ports:
      - "7574:7474"  # HTTP (shifted from 7474)
      - "7787:7687"  # Bolt (shifted from 7687)
    volumes:
      - /data/ice/stack/neo4j/data:/data
      - /data/ice/stack/neo4j/logs:/logs

  redis:
    image: redis:7-alpine
    ports:
      - "6479:6379"  # Shifted from 6379
    volumes:
      - /data/ice/stack/redis:/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6433:6333"  # HTTP (shifted from 6333)
      - "6434:6334"  # gRPC (shifted from 6334)
    volumes:
      - /data/ice/stack/qdrant:/qdrant/storage

  docling:
    image: ds4sd/docling:latest
    ports:
      - "5101:5001"  # Shifted from 5001

  neuralscape:
    build:
      context: ../../neuralscape-service
      dockerfile: Dockerfile
      target: runtime
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - DOCLING_URL=http://docling:5001
      - CODE_REPOS=${CODE_REPOS:-/data/ice/corpora}
    ports:
      - "8499:8199"  # API (shifted from 8199)
    volumes:
      - /data/ice/stack/ingest:/app/ingest_data
    depends_on:
      - neo4j
      - redis
      - qdrant
      - docling

  neuralscape-worker:
    build:
      context: ../../neuralscape-service
      dockerfile: Dockerfile
      target: runtime
    command: arq worker.WorkerSettings
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - DOCLING_URL=http://docling:5001
    volumes:
      - /data/ice/stack/ingest:/app/ingest_data
    depends_on:
      - neo4j
      - redis
      - qdrant

  neuralscape-graph-worker:
    build:
      context: ../../neuralscape-service
      dockerfile: Dockerfile
      target: runtime
    command: arq worker.GraphWorkerSettings
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - DOCLING_URL=http://docling:5001
    depends_on:
      - neo4j
      - redis
      - qdrant

  neuralscape-ingest-worker:
    build:
      context: ../../neuralscape-service
      dockerfile: Dockerfile
      target: runtime
    command: arq worker.IngestWorkerSettings
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - DOCLING_URL=http://docling:5001
    volumes:
      - /data/ice/stack/ingest:/app/ingest_data
    depends_on:
      - neo4j
      - redis
      - qdrant
      - docling
