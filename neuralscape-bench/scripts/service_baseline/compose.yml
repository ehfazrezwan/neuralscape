# Isolated service baseline stack (project name is set by the runner: ns-g-bench).
# No host ports are published; the driver runs inside the same network.
# Application services restart on failure, like the production compose file: the
# first cold start races on shared vector-store collection creation.
# Required env: NS_IMAGE (the exact tree image), BENCH_DIR (this repo's neuralscape-bench dir).
x-service-env: &service-env
  GOOGLE_API_KEY: fake-key
  NEO4J_URI: neo4j://neo4j:7687
  NEO4J_PASSWORD: bench-neo4j-password
  NEO4J_DATABASE: memory
  QDRANT_URL: http://qdrant:6333
  REDIS_URL: redis://redis:6379
  OBSIDIAN_VAULT_PATH: /data/vault
  DREAMING_ENABLED: "false"
  STRATEGY_SYNTHESIZER_ENABLED: "false"
  DOCLING_ENABLED: "false"
  INGEST_STORAGE_DIR: /data/ingest
  PYTHONPATH: /bench/scripts/service_baseline/shim
  FAKE_GENAI_BASE_URL: http://fake-provider:8080
  # Durability arms (all default off; set by the runner per arm).
  LEDGER_ENABLED: ${LEDGER_ENABLED:-false}
  LEDGER_SQLITE_PATH: /state/ledger.db
  LEDGER_BACKEND: ${LEDGER_BACKEND:-sqlite}
  LEDGER_POSTGRES_DSN: ${LEDGER_POSTGRES_DSN:-}
  AUTHORITY_ENABLED: ${AUTHORITY_ENABLED:-false}
  AUTHORITY_SQLITE_PATH: /state/authority.db
  AUTHORITY_BACKEND: ${AUTHORITY_BACKEND:-sqlite}
  AUTHORITY_POSTGRES_DSN: ${AUTHORITY_POSTGRES_DSN:-}
  NS_POLICY_MODE: ${NS_POLICY_MODE:-off}
  NS_AUTH_PROFILE: ${NS_AUTH_PROFILE:-legacy_compat}
  NEURALSCAPE_USER_TOKEN_SECRET: ${TOKEN_SECRET:-}
  HARNESS_WIRE_ENFORCER: ${HARNESS_WIRE_ENFORCER:-0}

x-service-mounts: &service-mounts
  - ${BENCH_DIR}:/bench:ro
  - state:/state

services:
  fake-provider:
    image: ${NS_IMAGE}
    command: ["python", "/bench/neuralscape_bench/service_baseline/fake_provider.py",
              "--generate-latency-ms", "${FAKE_GENERATE_MS:-50}", "--embed-latency-ms", "${FAKE_EMBED_MS:-20}"]
    environment: {PYTHONPATH: /bench}
    volumes: *service-mounts
    deploy: {resources: {limits: {memory: 512M}}}

  # PostgreSQL for the ledger and authority stores (pg arms only). The service
  # connects as a non-superuser owner role created by the runner.
  pg:
    image: postgres:16
    profiles: ["pg"]
    environment: {POSTGRES_PASSWORD: bench-pg-superuser}
    deploy: {resources: {limits: {memory: 1G}}}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 2s, timeout: 3s, retries: 30}

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/bench-neo4j-password
      NEO4J_initial_dbms_default__database: memory
    deploy: {resources: {limits: {memory: 2G}}}
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "bench-neo4j-password", "RETURN 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    deploy: {resources: {limits: {memory: 512M}}}
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 3s, timeout: 3s, retries: 20}

  qdrant:
    image: qdrant/qdrant:v1.15.0
    deploy: {resources: {limits: {memory: 2G}}}
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/6333'"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    image: ${NS_IMAGE}
    restart: on-failure
    command: ["python", "/bench/scripts/service_baseline/harness_api.py"]
    environment: {<<: *service-env, MCP_TRANSPORT: http, UVICORN_WORKERS: "${UVICORN_WORKERS:-1}"}
    volumes: [ "${BENCH_DIR}:/bench:ro", "ingest_data:/data/ingest", "state:/state" ]
    depends_on:
      neo4j: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      fake-provider: {condition: service_started}
    deploy: {resources: {limits: {memory: 3G}}}

  worker:
    image: ${NS_IMAGE}
    restart: on-failure
    command: ["arq", "worker.WorkerSettings"]
    environment: *service-env
    volumes: *service-mounts
    depends_on:
      neo4j: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      fake-provider: {condition: service_started}
    deploy: {resources: {limits: {memory: 2G}}}

  graph-worker:
    image: ${NS_IMAGE}
    restart: on-failure
    command: ["arq", "worker.GraphWorkerSettings"]
    environment: *service-env
    volumes: *service-mounts
    depends_on:
      neo4j: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      fake-provider: {condition: service_started}
    deploy: {resources: {limits: {memory: 2G}}}

  # Consumes the durable-ledger wake queue; only started when LEDGER_ENABLED=true.
  ledger-worker:
    image: ${NS_IMAGE}
    profiles: ["ledger"]
    restart: on-failure
    command: ["arq", "worker.LedgerWorkerSettings"]
    environment: *service-env
    volumes: [ "${BENCH_DIR}:/bench:ro", "state:/state" ]
    depends_on:
      neo4j: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      fake-provider: {condition: service_started}
    deploy: {resources: {limits: {memory: 2G}}}

  ingest-worker:
    image: ${NS_IMAGE}
    restart: on-failure
    command: ["arq", "worker.IngestWorkerSettings"]
    environment: *service-env
    volumes: [ "${BENCH_DIR}:/bench:ro", "ingest_data:/data/ingest", "state:/state" ]
    depends_on:
      neo4j: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      fake-provider: {condition: service_started}
    deploy: {resources: {limits: {memory: 2G}}}

  seed:
    image: ${NS_IMAGE}
    profiles: ["seed"]
    user: "0"
    entrypoint: ["python", "/bench/scripts/service_baseline/seed_authority.py",
                 "/state/authority.db", "/state/token", "${TOKEN_SECRET:-bench-token-secret}"]
    environment: {PYTHONPATH: /bench, PYTHONDONTWRITEBYTECODE: "1", GOOGLE_API_KEY: x, NEO4J_PASSWORD: x,
                  AUTHORITY_BACKEND: "${AUTHORITY_BACKEND:-sqlite}", AUTHORITY_POSTGRES_DSN: "${AUTHORITY_POSTGRES_DSN:-}"}
    volumes: [ "${BENCH_DIR}:/bench:ro", "state:/state" ]

  driver:
    image: ${NS_IMAGE}
    profiles: ["driver"]
    user: "0"
    entrypoint: ["python", "-m", "neuralscape_bench.service_baseline.driver"]
    environment: {PYTHONPATH: /bench, PYTHONDONTWRITEBYTECODE: "1"}
    volumes: [ "${BENCH_DIR}:/bench:ro", "${OUT_DIR}:/out", "state:/state:ro" ]
    deploy: {resources: {limits: {memory: 1G}}}

volumes:
  ingest_data:
  state:
